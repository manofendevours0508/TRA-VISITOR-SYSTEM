databases:
  - name: tra-direct-db
    databaseName: tra_direct
    user: tra_direct
    plan: free

services:
  - type: web
    name: tra-direct-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tra-direct-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_BASE_URL
        value: https://tra-direct-kiosk.onrender.com
      - key: PORT
        value: 4000

  - type: web
    name: tra-direct-kiosk
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tra-direct-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
